<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Here | Vow to Bloom</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#CD8899;
    --pink-dark:#B96E80;
    --gold:#DCC18A;
    --gold-dark:#C9A968;
    --cream:#FDF3E7;
    --ink:#2b2320;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(220,193,138,.20), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(205,136,153,.16), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(220,193,138,.14), transparent 50%),
      var(--cream);
    color:var(--ink);
    font-family:Jost,sans-serif;
    line-height:1.7;
  }
  .container{max-width:900px;margin:auto;padding:60px 24px 100px}
  h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:600;margin:0}
  h1{font-size:48px;text-align:center;line-height:1.2;
     background:linear-gradient(90deg,var(--pink-dark),var(--gold-dark));
     -webkit-background-clip:text;background-clip:text;color:transparent;}
  h2{font-size:32px;text-align:center;color:var(--pink-dark);margin-bottom:10px}
  .logo-wrap{text-align:center;margin-bottom:30px}
  .logo-wrap img{width:130px;height:auto;filter:drop-shadow(0 4px 10px rgba(201,169,104,.35))}
  .flourish{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px auto 40px}
  .flourish .line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent)}
  .flourish .diamond{width:7px;height:7px;background:var(--gold-dark);transform:rotate(45deg)}
  .subtitle{text-align:center;max-width:520px;margin:0 auto 46px;color:#6b5f57;font-size:16px}

  /* ---------- SELECTION CARDS ---------- */
  .area-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:640px;margin:0 auto}
  @media(max-width:600px){.area-grid{grid-template-columns:1fr}}
  .area-card{
    position:relative;
    cursor:pointer;
    background:linear-gradient(160deg,#ffffff,#FBF1E4);
    border:2px solid rgba(220,193,138,.4);
    border-radius:22px;
    padding:36px 22px;
    text-align:center;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow:0 10px 24px rgba(90,60,50,.06);
    user-select:none;
  }
  .area-card:hover{transform:translateY(-3px)}
  .area-card.selected{
    border-color:var(--pink-dark);
    box-shadow:0 14px 30px rgba(205,136,153,.28);
    background:linear-gradient(160deg,#ffffff,#FCEFE0);
  }
  .area-card .check-badge{
    position:absolute;top:14px;right:14px;
    width:26px;height:26px;border-radius:50%;
    background:linear-gradient(135deg,var(--pink),var(--gold-dark));
    color:#fff;display:none;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;
  }
  .area-card.selected .check-badge{display:flex}
  .area-icon{font-size:38px;margin-bottom:14px}
  .area-label{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--pink-dark);font-weight:600}

  .selection-meta{text-align:center;margin:26px 0 8px;color:#8a7c70;font-size:14px;letter-spacing:.3px}

  .btn{
    display:inline-block;
    background:linear-gradient(120deg,var(--pink) 0%,var(--pink-dark) 55%,var(--gold-dark) 130%);
    color:#fff;padding:16px 38px;border-radius:999px;text-decoration:none;
    font-weight:600;letter-spacing:.4px;border:none;cursor:pointer;font-family:Jost,sans-serif;font-size:15px;
    box-shadow:0 10px 24px rgba(205,136,153,.38);
    transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(205,136,153,.48)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-secondary{
    background:#fff;color:var(--pink-dark);border:1.5px solid rgba(220,193,138,.6);
    box-shadow:0 6px 16px rgba(90,60,50,.08);
  }
  .cta-wrap{text-align:center;margin-top:30px}

  /* ---------- DIVIDER ---------- */
  .divider{display:flex;align-items:center;gap:16px;max-width:560px;margin:80px auto 40px}
  .divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,104,.55),transparent)}
  .divider .diamond{width:8px;height:8px;background:var(--gold-dark);transform:rotate(45deg);flex-shrink:0}

  /* ---------- RESULTS ---------- */
  #results{display:none}
  .rec-block{
    background:linear-gradient(135deg, rgba(255,255,255,.7), rgba(253,243,231,.45));
    border:1px solid rgba(220,193,138,.4);
    border-radius:26px;
    padding:38px 32px;
    margin:0 0 34px;
    box-shadow:0 14px 32px rgba(90,60,50,.07);
  }
  .rec-eyebrow{text-align:center;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dark);font-weight:600;margin-bottom:6px}
  .rec-headline{text-align:center;font-size:30px;margin-bottom:22px}

  .highlight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:26px}
  @media(max-width:560px){.highlight-grid{grid-template-columns:1fr}}
  .highlight-card{
    background:#fff;border:1px solid rgba(220,193,138,.4);border-radius:16px;
    padding:18px 16px;box-shadow:0 6px 16px rgba(90,60,50,.06);
  }
  .highlight-card .hc-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .highlight-card .hc-icon{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--gold),var(--pink));color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .highlight-card .hc-title{font-weight:600;font-size:14.5px;color:var(--pink-dark)}
  .highlight-card p{margin:0;font-size:13.5px;color:#6b5f57;line-height:1.5}

  .identity-quote{
    text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;
    font-size:20px;color:var(--pink-dark);max-width:480px;margin:0 auto 26px;line-height:1.5;
  }

  .rec-actions{display:flex;flex-direction:column;align-items:center;gap:14px}
  .include-toggle{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    font-size:14px;color:#6b5f57;user-select:none;
  }
  .include-toggle input{width:17px;height:17px;accent-color:var(--pink-dark);cursor:pointer}

  .together-line{
    text-align:center;font-size:14px;color:var(--gold-dark);font-weight:600;
    letter-spacing:.3px;margin:-10px 0 34px;
  }

  .edit-link{
    display:block;text-align:center;margin:6px 0 50px;font-size:14px;
    color:#8a7c70;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:Jost,sans-serif;
  }

  /* ---------- PURCHASE SECTION ---------- */
  #purchase-section{
    display:none;
    text-align:center;
    padding:44px 30px;
    border-radius:28px;
    background:linear-gradient(135deg, rgba(205,136,153,.12), rgba(220,193,138,.18));
    border:1px solid rgba(220,193,138,.45);
  }
  .save-badge{
    display:inline-block;background:linear-gradient(120deg,var(--gold-dark),var(--pink-dark));
    color:#fff;font-size:13px;font-weight:700;letter-spacing:.5px;
    padding:6px 18px;border-radius:999px;margin-bottom:16px;
  }
  #purchase-title{font-size:28px;margin-bottom:10px}
  #purchase-sub{color:#6b5f57;font-size:15px;margin-bottom:24px}

  .unavailable-note{
    max-width:340px;margin:0 auto 20px;font-size:13px;color:#a8836b;
    background:#fff8ee;border:1px solid rgba(220,193,138,.5);border-radius:12px;padding:12px 16px;
  }

  .guarantee-line{
    margin-top:26px;font-size:13.5px;color:#8a7c70;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="logo-wrap">
    <img src="https://vowtobloom.github.io/vtb-pages/VTBTransparentLogo.PNG" alt="Vow to Bloom Logo">
  </div>

  <section id="selection-section">
    <h1>Start Here</h1>
    <div class="flourish"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
    <h2 style="font-size:26px">What do you want to focus on right now?</h2>
    <p class="subtitle">Choose one or both — we'll show you exactly what's right for you.</p>

    <div class="area-grid" id="areaGrid"></div>

    <p class="selection-meta" id="selectionMeta">0 selected</p>
    <div class="cta-wrap">
      <button class="btn" id="seeRecBtn" disabled>See My Recommendation</button>
    </div>
  </section>

  <div class="divider" id="resultsDivider" style="display:none">
    <span class="line"></span><span class="diamond"></span><span class="line"></span>
  </div>

  <section id="results">
    <h2 id="resultsHeading">Your Personalized Recommendation</h2>
    <div id="recBlocks"></div>
    <button class="edit-link" id="editLink">← Edit My Selections</button>
  </section>

  <section id="purchase-section">
    <div class="save-badge" id="saveBadge" style="display:none">SAVE 15%</div>
    <h3 id="purchase-title">Get Your Templates</h3>
    <p id="purchase-sub">Everything you need, ready to go.</p>
    <div class="unavailable-note" id="unavailableNote" style="display:none"></div>
    <button class="btn" id="purchaseBtn">Continue</button>
    <div class="guarantee-line">🔒 14-Day Money Back Guarantee</div>
  </section>

</div>

<script>
  // ---------- PRODUCT DATA ----------
  const PRODUCTS = [
    {
      id: 'wellness',
      cardLabel: 'Self Care',
      cardIcon: '✨',
      name: 'Wellness Hub OS',
      eyebrow: 'Your Fit',
      headline: 'Wellness Hub OS',
      highlights: [
        { icon:'🏋️‍♀️', title:'Fitness Mode', text:'Your workout runs itself — playlist launches, sets are timed, and every session logs automatically.' },
        { icon:'🧴', title:'Skincare, Solved', text:'Your routine updates itself daily — no more standing at the sink wondering what step comes next.' },
        { icon:'📋', title:'One Dashboard, Every Task', text:'Appointments, supplements, and beauty to-dos — all in one guided checklist.' },
        { icon:'📊', title:'Progress You Can See', text:'Watch your consistency build automatically, with zero manual tracking.' }
      ],
      identity: '“Become the woman whose self-care runs itself — effortlessly put-together, every single day.”',
      salesUrl: 'https://vowtobloom.github.io/vtb-pages/wellness-sales-page.html?from=start'
    },
    {
      id: 'books',
      cardLabel: 'Reading Habit',
      cardIcon: '📖',
      name: 'Book Hub OS',
      eyebrow: 'Your Fit',
      headline: 'Book Hub OS',
      highlights: [
        { icon:'🔒', title:'Built-In Accountability', text:'Your distracting apps stay locked until you\'ve read for 15 minutes — no willpower required.' },
        { icon:'⚡', title:'Log In Seconds', text:'Add to your TBR or log a session with one tap — no typing, no friction.' },
        { icon:'📈', title:'Watch Your Habit Build', text:'Automatic stats and streaks turn "I should read more" into "I actually read more."' },
        { icon:'📚', title:'Your Whole Reading Life, Organized', text:'TBR list, digital library, and reading log — all in one place.' }
      ],
      identity: '“Become the woman who always finishes what she starts — who turns \'I should read more\' into a life full of books.”',
      salesUrl: '❗ADD-BOOK-HUB-SALES-PAGE-URL❗?from=start'
    }
  ];

  // Your Cloudflare Worker endpoint — creates the Stripe Checkout Session dynamically
  const WORKER_URL = '❗https://your-worker-name.your-subdomain.workers.dev❗';

  const selectedAreas = new Set();   // life-area cards chosen on step 1
  const orderSelected = new Set();   // "include in my order" toggles on results screen

  // ---------- RENDER SELECTION CARDS ----------
  const areaGrid = document.getElementById('areaGrid');
  PRODUCTS.forEach(p => {
    const card = document.createElement('div');
    card.className = 'area-card';
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="check-badge">✓</div>
      <div class="area-icon">${p.cardIcon}</div>
      <div class="area-label">${p.cardLabel}</div>
    `;
    card.addEventListener('click', () => {
      card.classList.toggle('selected');
      if (selectedAreas.has(p.id)) selectedAreas.delete(p.id);
      else selectedAreas.add(p.id);
      updateSelectionMeta();
    });
    areaGrid.appendChild(card);
  });

  function updateSelectionMeta(){
    const n = selectedAreas.size;
    document.getElementById('selectionMeta').textContent = n === 0 ? '0 selected' : `${n} selected`;
    document.getElementById('seeRecBtn').disabled = n === 0;
  }

  // ---------- SEE MY RECOMMENDATION ----------
  document.getElementById('seeRecBtn').addEventListener('click', () => {
    orderSelected.clear();
    const recBlocks = document.getElementById('recBlocks');
    recBlocks.innerHTML = '';

    const matched = PRODUCTS.filter(p => selectedAreas.has(p.id));
    matched.forEach(p => orderSelected.add(p.id));

    matched.forEach(p => {
      const block = document.createElement('div');
      block.className = 'rec-block';
      block.innerHTML = `
        <div class="rec-eyebrow">${p.eyebrow}</div>
        <div class="rec-headline">${p.headline}</div>
        <div class="highlight-grid">
          ${p.highlights.map(h => `
            <div class="highlight-card">
              <div class="hc-top">
                <div class="hc-icon">${h.icon}</div>
                <div class="hc-title">${h.title}</div>
              </div>
              <p>${h.text}</p>
            </div>
          `).join('')}
        </div>
        <div class="identity-quote">${p.identity}</div>
        <div class="rec-actions">
          <label class="include-toggle">
            <input type="checkbox" checked data-id="${p.id}" class="include-checkbox">
            Add to my order
          </label>
          <a class="btn btn-secondary" href="${p.salesUrl}">Learn More</a>
        </div>
      `;
      recBlocks.appendChild(block);
    });

    if (matched.length > 1) {
      const line = document.createElement('div');
      line.className = 'together-line';
      line.textContent = "You'll get the most out of both.";
      recBlocks.insertBefore(line, recBlocks.children[1]);
    }

    document.querySelectorAll('.include-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) orderSelected.add(cb.dataset.id);
        else orderSelected.delete(cb.dataset.id);
        renderPurchaseSection();
      });
    });

    document.getElementById('selection-section').style.display = 'none';
    document.getElementById('resultsDivider').style.display = 'flex';
    document.getElementById('results').style.display = 'block';
    renderPurchaseSection();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- EDIT MY SELECTIONS ----------
  document.getElementById('editLink').addEventListener('click', () => {
    document.getElementById('results').style.display = 'none';
    document.getElementById('resultsDivider').style.display = 'none';
    document.getElementById('purchase-section').style.display = 'none';
    document.getElementById('selection-section').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- PURCHASE SECTION ----------
  function renderPurchaseSection(){
    const section = document.getElementById('purchase-section');
    const n = orderSelected.size;

    if (n === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';

    const saveBadge = document.getElementById('saveBadge');
    const title = document.getElementById('purchase-title');
    const sub = document.getElementById('purchase-sub');
    const note = document.getElementById('unavailableNote');
    const purchaseBtn = document.getElementById('purchaseBtn');
    note.style.display = 'none';
    purchaseBtn.disabled = false;

    if (n === 1) {
      const product = PRODUCTS.find(p => orderSelected.has(p.id));
      saveBadge.style.display = 'none';
      title.textContent = `Get ${product.name}`;
      sub.textContent = 'Instant access after checkout.';
      purchaseBtn.textContent = `Get ${product.name}`;
    } else {
      saveBadge.style.display = 'inline-block';
      saveBadge.textContent = n >= 3 ? 'SAVE 20%' : 'SAVE 15%';
      title.textContent = 'Bundle & Save';
      sub.textContent = `Get all ${n} templates together and save automatically.`;
      purchaseBtn.textContent = 'Continue to Checkout';
    }

    purchaseBtn.onclick = async () => {
      purchaseBtn.disabled = true;
      const originalText = purchaseBtn.textContent;
      purchaseBtn.textContent = 'Loading checkout...';
      note.style.display = 'none';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productIds: Array.from(orderSelected) })
        });
        const data = await res.json();

        if (data.url) {
          window.open(data.url, '_blank');
          purchaseBtn.textContent = originalText;
          purchaseBtn.disabled = false;
        } else {
          note.style.display = 'block';
          note.textContent = data.error || 'Something went wrong. Please try again.';
          purchaseBtn.textContent = originalText;
          purchaseBtn.disabled = false;
        }
      } catch (err) {
        note.style.display = 'block';
        note.textContent = 'Could not reach checkout. Please try again.';
        purchaseBtn.textContent = originalText;
        purchaseBtn.disabled = false;
      }
    };
  }
</script>
</body>
</html>
